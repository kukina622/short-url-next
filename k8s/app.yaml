apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: short-url-ingress-rewrite
  labels:
    app.kubernetes.io/name: short-url-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /api/$1
spec:
  ingressClassName: nginx
  rules:
  - host: short-url.local
    http:
      paths:
      - pathType: ImplementationSpecific
        path: "/([^/]+)$"
        backend:
          service:
            name: short-url-service
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: short-url-ingress-root
  labels:
    app.kubernetes.io/name: short-url-app
spec:
  ingressClassName: nginx
  rules:
  - host: short-url.local
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: short-url-service
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: short-url-service
  labels:
    app: short-url-app
spec:
  type: ClusterIP
  selector:
    app: short-url-app
  ports:
  - port: 8080
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: short-url-deployment
  labels:
    app: short-url-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: short-url-app
  template:
    metadata:
      labels:
        app: short-url-app
    spec:
      containers:
      - name: short-url-app
        image: short-url-app:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
